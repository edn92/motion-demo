<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/motion-demo/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>motion-demo</title>
    <script type="module" crossorigin src="/motion-demo/assets/main-BzWNwxEJ.js"></script>
    <link rel="stylesheet" crossorigin href="/motion-demo/assets/main-HEQvDjNV.css">
  </head>
  <body data-theme='dark'>
    <div id="root"></div>
    <script>
      (() => {
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </body>
</html>
